[package]
name = "sage-ui"
description = "Iced shell, Sage & Paper theme, panels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14.0", features = ["advanced", "tokio", "image-without-codecs", "svg"] }
# The image formats embeds can show; iced's `image` feature would pull in every codec.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = "0.40.2"
sage-core.workspace = true
sage-db.workspace = true
sage-indexer.workspace = true
sage-watcher.workspace = true
sage-editor.workspace = true
sage-markdown.workspace = true
sage-onedrive.workspace = true
sage-query.workspace = true
tokio = { version = "1.54.1", features = ["fs", "rt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
arboard = "3.7.0"

[dev-dependencies]
tempfile = "3"

# Opening links with the shell, and the folder picker for another vault.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
rfd = "0.15"
tauri-winrt-notification = "0.8.1"
