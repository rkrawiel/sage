[package]
name = "sage-app"
default-run = "sage"
description = "The sage binary, for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sage-ui.workspace = true
sage-watcher.workspace = true
anyhow = "1"

# The folder picker and the error box, where the app starts without a console.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[[bin]]
name = "sage"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3"
